services:
  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: compta-asso:latest
    container_name: compta-asso
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./instance:/app/instance
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
