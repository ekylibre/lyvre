# Lyvre — déploiement Dokploy (service Compose, domaine lyvre.seconde-nature.net) ou serveur Docker.
# - Ni `container_name` ni `image` nommée : plusieurs services (ancien et nouveau) cohabitent sur le
#   même hôte sans conflit de nom ni d'image.
# - Pas de port publié sur l'hôte : le proxy (Traefik de Dokploy, domaine → port 5000 du conteneur)
#   s'en charge. En local : docker compose -f docker-compose.yml -f docker-compose.local.yml up.
# - Données (méta-base, bases des instances, pièces) : INSTANCE_DIR, propre à chaque service ;
#   défaut ../files/instance = dossier persistant de Dokploy. Jamais le dossier d'un autre service.
services:
  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ${INSTANCE_DIR:-../files/instance}:/app/instance:rw
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
