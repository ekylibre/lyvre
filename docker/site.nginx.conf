# lyvre.org : site statique. Seul /api/contact (formulaire) est relayé, vers le service « contact ».

# www.lyvre.org → lyvre.org (domaine canonique).
server {
  listen 80;
  server_name www.lyvre.org;
  return 301 https://lyvre.org$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  # Redirections relatives (/contact → /contact/) : derrière le proxy HTTPS, une adresse absolue partirait en http://.
  absolute_redirect off;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Le nom « contact » est résolu à chaque requête (DNS de Docker) : nginx démarre même sans le service.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $contact http://contact:5000;

  location = /api/contact {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass $contact;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 502 503 504 = @contact_down;
  }
  location @contact_down { return 303 /contact/?erreur=service; }
  location /api/ { return 404; }

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
