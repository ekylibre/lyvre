    label: Pépinières et autres végétaux
    methods: [actual, standard, retail, flat]
    accounts:
      - {prefix: "31142", variation: "713553"}
      - {prefix: "31148", variation: "713553"}
      - {prefix: "3114", variation: "713553"}
      - {prefix: "31152", variation: "713554"}
      - {prefix: "31158", variation: "713554"}
      - {prefix: "3115", variation: "713554"}
  - key: in_progress
