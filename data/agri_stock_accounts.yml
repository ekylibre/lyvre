# Inventaire de clôture (lot AG4, claudedocs/design_inventaire_agricole.md § 3, décision AGD21).
#
# Catégories de stock du plan agricole (Recueil PCG 2026, titre 5) : comptes de stock (préfixes, le plus long
# l'emporte), compte de variation proposé (modifiable par ligne) et méthodes de valorisation permises.
# - Prix de détail : interdit pour les approvisionnements achetés (PCG 618-13, 4°) et les avances aux cultures
#   (PCG 618-14, 2°).
# - Forfaitaire : jamais pour les approvisionnements achetés ni les avances aux cultures.
# - Animaux achetés (AGD21, Q-S2) : charge 60117 à l'achat, puis stock sur la même variation que les animaux nés.
# `purchase` : compte de charge correspondant, pour le repère « achats de l'exercice » du coût réel.
categories:
  - key: supplies
    group: supplies
    label: Approvisionnements
    methods: [actual, standard]
    accounts:
      - {prefix: "31111", variation: "6031", purchase: "60111"}
      - {prefix: "31112", variation: "6031", purchase: "60112"}
      - {prefix: "31113", variation: "6031", purchase: "60113"}
      - {prefix: "31114", variation: "6031", purchase: "60114"}
      - {prefix: "31115", variation: "6031", purchase: "60115"}
      - {prefix: "31116", variation: "6031", purchase: "60116"}
      - {prefix: "3111", variation: "6031", purchase: "6011"}
      - {prefix: "311", variation: "6031"}
      - {prefix: "31", variation: "6031"}           # compte 31 tenu sans détail (dossiers repris)
  - key: other_supplies
    group: supplies
    label: Autres approvisionnements (carburant, emballages, fournitures)
    methods: [actual]
    accounts:
      - {prefix: "32", variation: "6032"}
  - key: goods
    group: supplies
    label: Marchandises
    methods: [actual]
    accounts:
      - {prefix: "37", variation: "6037", purchase: "607"}
  - key: animals_long
    group: animals
    label: Animaux, cycle long (non immobilisés)
    methods: [actual, standard, retail, flat]
    accounts:
      - {prefix: "3112", variation: "713551", purchase: "60117"}
  - key: animals_short
    group: animals
    label: Animaux, cycle court
    methods: [actual, standard, retail, flat]
    accounts:
      - {prefix: "3113", variation: "713552", purchase: "60117"}
  - key: crop_advances
    group: crops
