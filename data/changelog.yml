# Nouveautés de Lyvre : source unique du numéro de version, de CHANGELOG.md et de la page
# « Nouveautés ». Ajouter les entrées sous « next », puis `python scripts/release.py publish`.
# kind : new | improved | fixed | action ; structure : asso | sci (absent : toutes) ;
# text : pour l'utilisateur ; tech : précision pour CHANGELOG.md seulement.
next:
- kind: fixed
  text: >-
    Assistant — en service, la réponse restait vide sans message : la conversation n'était plus lisible pendant la
    diffusion. Elle est relue au moment de répondre, et une réponse interrompue est désormais signalée. Les tableaux
    de l'assistant s'affichent en tableau ; il lit aussi le bloc « À vérifier » de l'échéancier (exercice manquant…)
    et le signale en premier.
  tech: >-
    api/assistant.assistant_ask (relecture dans le flux) ; AssistantDrawer (fin de flux sans événement, MarkdownTable,
    paragraphes en div) ; tools.get_agenda « checks » ; PageHeader et ChecklistsPanel (pas de bloc dans un p).
- kind: fixed
  text: >-
    Échéancier — quand aucun exercice ne couvre la date du jour, « À vérifier » le signale : la CA12A et les acomptes
    de TVA ne peuvent pas être calculés. Les rappels silencieux passés (acomptes du prélèvement à la source, prélevés
    automatiquement ; fins de fenêtres d'option) ne s'affichent plus en retard. La date de la facturation électronique
    suit la taille d'entreprise déclarée.
  tech: >-
    agenda_checks._vat_setup (vat_no_fiscal_year) ; agenda.occurrences (quiet passé → done) ; deadlines règle once
    avec param (TVA-07, einvoice.issue_start.{company_size}).
- kind: new
  text: >-
    Facturation électronique — l'écran e-reporting indique la date à laquelle l'émission et l'e-reporting deviennent
    obligatoires pour l'entreprise : 1er septembre 2026 pour une grande entreprise ou une ETI, 1er septembre 2027 pour
    une PME ou une micro-entreprise (taille à déclarer dans Structure › Fiscalité, PME par défaut).
  tech: >-
    data/regulatory/einvoice.json (einvoice.reception_start, issue_start.large, issue_start.sme) ;
    tax_profile.KINDS company_size ; ereporting.obligation.
- kind: fixed
  text: >-
    E-reporting B2C — l'écran s'ouvre sur le dernier mois terminé, celui qu'on exporte, et signale quand la période
    suit la dernière écriture. En partie double, le cadre des catégories explique que les ventes directes sont celles
    du journal de caisse au lieu d'afficher un bouton sans case à cocher.
  tech: >-
    api/ereporting._period (mois précédent), last_entry_date ; EreportingPage lastMonth, DirectSaleCategories.
- kind: improved
