# Dispositifs d'aide (lot AG3, claudedocs/design_aides_pac.md § 3, décision AGD20).
#
# Les comptes sont des propositions validées par l'expert-comptable (AGD20) ; un dossier garde le compte choisi
# à sa création, même si ce fichier change. Un sous-compte absent du plan se crée sous `parent`, ou l'on garde
# le parent.
#
# Champs :
# - nature : operating (subvention d'exploitation) | investment (131) | mixed (DJA : part d'exploitation + 131)
# - trigger : fait générateur du rattachement (§ 4) — pac_deadline (date limite de la demande PAC, `trigger_key`
#   pour un autre paramètre de l'échéancier), decision (décision d'attribution), payment (encaissement)
# - payer : organisme qui verse (rapprochement bancaire, AG3.b)
# - campaign : proposé par « Nouvelle campagne PAC » ; `default` = coché d'office, `when` = condition du profil
#   (flags / productions de l'échéancier, une seule suffit)
# - payments : versements types (avance d'octobre, solde de décembre…)
schemes:
  - key: basic_income
    label: Aide de base au revenu (DPB)
    pillar: 1
    nature: operating
    account: "7451"
    parent: "745"
    trigger: pac_deadline
    payer: ASP
    payments: [advance, balance]
    campaign: {default: true}

  - key: redistributive
    label: Paiement redistributif
    pillar: 1
    nature: operating
    account: "7452"
    parent: "745"
    trigger: pac_deadline
    payer: ASP
    payments: [advance, balance]
    campaign: {default: true}

