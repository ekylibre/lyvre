    structures: associations
  - name: Stancer
    usage: Versements et paiements par carte
    structures: toutes
  - name: Odoo
    usage: Caisse, factures clients
    structures: toutes
  - name: SMTP
    usage: Relances, reçus, factures par e-mail
    structures: toutes
  - name: Documenso
    usage: Signature électronique des baux
    structures: toutes
  - name: SUPER PDP
    usage: "Facture électronique : envoi des ventes, réception des achats (une seule plateforme agréée à la fois)"
    structures: toutes
  - name: Sirene (INSEE)
    usage: Pré-remplissage de la structure et des tiers
    structures: toutes (clé du serveur)
  - name: Claude
