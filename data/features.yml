# Présentation publique de Lyvre : source unique des sections générées du README et du site lyvre.org.
# Après modification : `python scripts/release.py build` (README), le site la relit à sa construction.
# Textes publics : aucune donnée réelle (structure, client, personne). `release.py check` le contrôle.
#
# structures : asso | sci | agri | societe (absent : toutes)
# capture : fichier de doc/images/ (régénéré par `make captures`)
# since : version publiée qui a apporté la fonctionnalité (facultatif)
# status : available | soon

highlights:
  - emoji: 📒
    title: Comptabilité complète
    text: Partie double au clavier ou comptabilité simplifiée, plan associatif, SCI, agricole ou général, lettrage, immobilisations.
  - emoji: 🏦
    title: Banque sans ressaisie
    text: Qonto ou OFX, rapprochement au clavier avec suggestions, règles, factures lues automatiquement.
  - emoji: ✅
    title: Prêt pour l'expert-comptable
    text: Écritures validées intangibles, clôture guidée, à-nouveaux, FEC conforme, accès en lecture seule.
  - emoji: 🔐
    title: Libre et chez vous
    text: AGPL-3.0, une base par structure, sauvegardes avec les pièces, aucune donnée envoyée sans intégration activée.

audiences:
  - id: asso
    emoji: 🌱
    title: Une association
    capture: adherents.png
    alt: Liste des adhérents avec dates d'adhésion, échéances et statut
    points:
      - Plan comptable associatif (règlement ANC 2018-06), contributions volontaires, fonds dédiés.
      - Adhésions HelloAsso et caisse, échéances, relances par e-mail, bénévolat valorisé.
      - Reçus fiscaux Cerfa numérotés, PDF figés, envoi et état annuel.
      - Liste des adhérents synchronisée vers **Brevo**, sans doublon.
  - id: sci
    emoji: 🏡
    title: Une SCI
    capture: bail-carte.png
    alt: Carte d'un bail, photo aérienne et parcelles cadastrales de l'IGN
    points:
      - "Associés : registre des parts (usufruit, nue-propriété), comptes courants, intérêts."
      - Baux par lots, carte des parcelles et bâtiments (IGN), modèles relus, texte figé.
      - Signature électronique (Documenso auto-hébergé), quittances, révision des loyers sur les indices INSEE.
      - Reprise d'une comptabilité Ekylibre.
  - id: agri
    emoji: 🌾
    title: Une exploitation agricole
    capture: agri-echeancier.png
    alt: Échéancier d'une exploitation agricole, liste de contrôle d'automne et démarches à préciser
    points:
      - Plan comptable agricole (EI, EARL, GAEC, SCEA), micro-BA ou réel, bilan et compte de résultat agricoles.
      - Inventaire de clôture, avances aux cultures, biens vivants et lots d'animaux, valeur fiscale des stocks.
      - Résultat fiscal, abattement jeune agriculteur, DEP, assiette des cotisations MSA, aide à la liasse BA.
      - Aides PAC et subventions suivies jusqu'à la clôture, TVA agricole (CA12A, acomptes, remboursement forfaitaire), échéancier avec résumé du lundi et agenda iCal.
  - id: societe
    emoji: 🏢
    title: Une société
    points:
      - Plan comptable général 2026, bilan et compte de résultat présentés comme la liasse 2050.
      - Codes de TVA sur les écritures, autoliquidation, déclarations CA3 calculées depuis les écritures.
      - Facturation électronique (Factur-X, plateforme agréée), relevés de compte conservés.
      - Statut de jeune entreprise innovante, archive de l'exercice pour l'expert-comptable.
  - id: expert
    emoji: 🧮
    title: L'expert-comptable
    capture: cloture.png
    alt: Assistant de clôture, étapes et contrôles
    points:
      - Accès en lecture seule à la structure, sans rien pouvoir modifier.
      - Validation par lots, verrouillage de période, historique de chaque écriture.
      - "Assistant de clôture : contrôles, inventaire, CCA / PCA, dotations, résultat, FEC."
      - Reprise d'historique depuis un FEC, un tableur ou une sauvegarde Ekylibre.
  - id: hebergeur
    emoji: 🛠️
    title: L'hébergeur
    capture: integrations.png
    alt: Page des intégrations
    points:
      - Une image Docker, plusieurs structures, une base SQLite par structure.
      - Migrations de toutes les bases au démarrage, sauvegardes `.zip` avec les pièces jointes.
      - Intégrations activées structure par structure, testées depuis l'écran.
      - Version et nouveautés dans l'application, changelog avec les actions requises.

