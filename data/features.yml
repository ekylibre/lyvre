domains:
  # intro : ce que le module apporte, en une phrase (page Fonctionnalités du site).
  # captures : écrans du module (doc/images/), la première en grand.
  - id: compta
    emoji: 📒
    title: Comptabilité
    intro: Tenir les comptes en partie double au clavier, ou en recettes et dépenses quand la structure est petite.
    captures:
      - file: compta-ecritures.png
        alt: Liste des écritures de l'exercice, avec journal, origine, montant et numéro de validation
      - file: compta-bilan.png
        alt: Bilan d'une exploitation agricole, actif brut, amortissements et net, passif
  - id: banque
    emoji: 🏦
    title: Banque et caisse
    intro: Chaque ligne du relevé trouve son écriture, au clavier, avec des suggestions et des règles.
    captures:
      - file: rapprochement.png
        alt: Rapprochement bancaire, transactions à traiter et écriture suggérée
  - id: achats
    emoji: 🧾
    title: Achats
    intro: Les factures fournisseurs arrivent de Qonto ou d'un dépôt de fichier, sont lues, puis comptabilisées.
    captures:
      - file: abonnements.png
        alt: Abonnements, coût mensuel et échéances manquantes
  - id: ventes
    emoji: 💶
    title: Ventes et facturation électronique
    intro: Du devis à l'encaissement, avec le PDF Factur-X et la plateforme agréée de la réforme.
    captures:
      - file: facture.png
        alt: Facture payée, client, lignes et encaissement rapproché
      - file: ventes.png
        alt: Liste des factures, devis et brouillons avec leur état et le restant dû
  - id: baux
    emoji: 🏡
    title: Baux et associés
    intro: Les baux d'une SCI ou d'un propriétaire, de la carte des parcelles à la quittance.
    captures:
      - file: bail.png
        alt: Fiche d'un bail, avis d'échéance, quittances et dépôt de garantie
      - file: bail-carte.png
        alt: Carte d'un bail, photo aérienne et parcelles cadastrales de l'IGN
  - id: tiers
    emoji: 🤝
    title: Tiers, adhérents, dons
    intro: Clients, fournisseurs, adhérents et donateurs au même endroit, complétés depuis Sirene.
    captures:
      - file: adherents.png
        alt: Liste des adhérents avec dates d'adhésion, échéances et statut
      - file: sirene.png
        alt: Structure complétée depuis le répertoire Sirene de l'INSEE
  - id: agri
    emoji: 🌾
    title: Exploitation agricole
    intro: Le plan agricole, l'inventaire, les biens vivants, les aides et le résultat fiscal des bénéfices agricoles.
    captures:
      - file: agri-marges.png
        alt: Marges par activité, production, charges opérationnelles et marge brute par hectare ou par tête
  - id: fiscal
    emoji: 🏛️
    title: TVA et fiscalité
    intro: Les déclarations préparées depuis les écritures et un échéancier qui dit quoi faire cette semaine.
    captures:
      - file: agri-echeancier.png
        alt: Échéancier d'une exploitation agricole, liste de contrôle d'automne et démarches à préciser
      - file: tva-agricole.png
        alt: Déclarations de TVA d'une exploitation, CA12A annuelles et acomptes trimestriels
  - id: pilotage
    emoji: 📊
    title: Pilotage et clôture
    intro: Ce qui reste à faire, le résultat au fil de l'année, puis une clôture guidée jusqu'au FEC.
    captures:
      - file: tableau-de-bord.png
        alt: Tableau de bord, à traiter, résultat, facturé et encours clients
      - file: cloture.png
        alt: Assistant de clôture, étapes et contrôles
  - id: api
    emoji: 🤖
    title: Agents et API
    intro: Un agent ou un script lit le dossier et prépare des brouillons, avec des droits bornés par structure.
    captures:
      - file: api-cles.png
        alt: Accès API, clés par usage avec leurs domaines et leur expiration

features:
  # --- Comptabilité
  - id: plans-comptables
    domain: compta
    title: Plans comptables
    text: Plan associatif (ANC 2018-06), SCI, agricole (Recueil PCG 2026) ou général 2026, choisi à la création de la structure.
  - id: partie-double
    domain: compta
    title: Partie double au clavier
    text: Journaux, grand livre, balance, bilan et compte de résultat N / N-1.
  - id: compta-simplifiee
    domain: compta
    title: Comptabilité simplifiée
    text: Recettes et dépenses par catégorie, passage en partie double sans ressaisie.
  - id: validation
    domain: compta
    title: Écritures intangibles
    text: Validation par lots, écritures corrigées par extourne, historique, verrouillage de période.
  - id: lettrage-immos
    domain: compta
    title: Lettrage et immobilisations
    text: Lettrage automatique ou au clavier, à-nouveaux détaillés, immobilisations et amortissements, charges et produits constatés d'avance, contributions volontaires en nature.
  # --- Banque
  - id: import-bancaire
    domain: banque
    title: Relevés importés
    text: Import OFX et synchronisation Qonto, dédoublonnés, opérations annulées gérées, relevés de compte conservés.
  - id: rapprochement
    domain: banque
    title: Rapprochement au clavier
    text: Suggestions classées, rapprochement en masse et annulable, règles de catégorisation proposées depuis un mois.
    capture: rapprochement.png
  - id: reglements-multiples
    domain: banque
    title: Factures réglées en plusieurs fois
    text: Acomptes, échéanciers et virements échelonnés rattachés à une facture d'achat ou de vente.
    since: 2026.11.2
  - id: caisse-tresorerie
    domain: banque
    title: Caisse et trésorerie
    text: Caisse en espèces et dépôts en banque, solde bancaire face au solde comptable, prévisionnel de trésorerie sur 12 mois.
  # --- Achats
  - id: factures-achat
    domain: achats
    title: Factures fournisseurs lues
    text: Qonto ou dépôt d'un fichier, lecture Factur-X, PDF ou photo (OCR), pièce conservée.
  - id: catalogue
    domain: achats
    title: Catalogue et engagements
    text: Catalogue de produits, compte proposé par fournisseur, règlements rapprochés.
  - id: abonnements
    domain: achats
    title: Abonnements
    text: Coût mensuel, échéances manquantes et préavis de résiliation suivis échéance par échéance.
    capture: abonnements.png
  # --- Ventes
  - id: factures-vente
    domain: ventes
    title: Devis, factures et avoirs
    text: Numérotés, PDF Factur-X, journal des ventes, envoi par e-mail, relances et factures récurrentes.
    capture: ventes.png
  - id: encaissements
    domain: ventes
    title: Encaissements rapprochés
    text: Facture encaissée depuis le relevé, TVA à l'encaissement ou sur les débits.
    capture: facture.png
  - id: facture-electronique
    domain: ventes
    title: Facturation électronique
    text: Envoi et réception par une plateforme agréée (SUPER PDP), e-reporting, autofactures et décomptes de coopérative.
  # --- Baux
  - id: assistant-bail
    domain: baux
    structures: [sci]
    title: Baux
    text: Assistant, modèles relus, carte IGN, avis d'échéance, dépôt de garantie, quittances en un clic.
    capture: bail.png
  - id: signature
    domain: baux
    structures: [sci]
    title: Signature et révision
    text: Signature électronique Documenso, révision des loyers (ILC, ILAT, IRL, fermages) sur les indices INSEE.
  - id: associes
    domain: baux
    structures: [sci]
    title: Associés
    text: Registre des parts (usufruit, nue-propriété), comptes courants d'associés et intérêts.
  # --- Tiers
  - id: sirene
    domain: tiers
    title: Tiers et Sirene
    text: Structure et tiers pré-remplis et mis à jour depuis l'API Sirene de l'INSEE (SIREN, adresse, NAF, TVA).
    capture: sirene.png
  - id: adhesions
    domain: tiers
    structures: [asso]
    title: Adhésions
    text: Adhésions HelloAsso et caisse, échéances, relances, bénévolat, liste synchronisée vers Brevo.
    capture: adherents.png
  - id: recus-fiscaux
    domain: tiers
    structures: [asso]
    title: Reçus fiscaux
    text: Particuliers (Cerfa 11580) et entreprises (16216), dons en nature, état annuel.
  # --- Agricole (group : sous-partie du module sur la page Fonctionnalités)
  - id: plan-agricole
    domain: agri
    group: Plan et états
    structures: [agri]
    title: Plan « Exploitation agricole »
    text: EI, EARL, GAEC, SCEA, création en trois étapes (forme, impôt et régime, premier exercice), bilan et compte de résultat agricoles, soldes intermédiaires de gestion, annexe des biens vivants.
    since: 2026.11.6
  - id: micro-ba
    domain: agri
    group: Plan et états
    structures: [agri]
    title: Micro-BA ou réel
    text: Livre des recettes du micro-BA, récapitulatif sur trois ans et bénéfice forfaitaire, simulation micro-BA ou réel et alerte de changement de régime.
    since: 2026.11.6
  - id: catalogue-agricole
    domain: agri
    group: Plan et états
    structures: [agri]
    title: Articles et règles agricoles
    text: Engrais, semences, aliments, animaux avec compte et taux de TVA proposés ; règles bancaires MSA, ASP, FranceAgriMer et fermages.
    since: 2026.11.6
  - id: inventaire
    domain: agri
    group: Inventaire et biens vivants
    structures: [agri]
    title: Inventaire de clôture
    capture: agri-inventaire.png
    text: Stocks ligne par ligne au coût réel, au coût standard ou au prix de détail, valeur fiscale (méthode forfaitaire, stock bloqué), écriture de stock sans extourne à l'ouverture.
    since: 2026.11.6
  - id: avances-cultures
    domain: agri
    group: Inventaire et biens vivants
    structures: [agri]
    title: Avances aux cultures
    text: Une fiche par culture en terre, valorisée sur vos barèmes par hectare et par mois ou au coût réel des charges retenues.
    since: 2026.11.6
  - id: lots-animaux
    domain: agri
    group: Inventaire et biens vivants
    structures: [agri]
    title: Lots d'animaux
    text: Naissances, achats, ventes, morts et passages d'un lot à l'autre ; écart entre l'effectif théorique et l'effectif compté.
    since: 2026.11.6
  - id: biens-vivants
    domain: agri
    group: Inventaire et biens vivants
    structures: [agri]
    title: Biens vivants
    text: Reproducteurs et plantations immobilisés, en-cours puis entrée en production, morts, sinistres, abattage sanitaire et provision pour hausse de valeur des vaches.
    since: 2026.11.6
  - id: resultat-fiscal
    domain: agri
    group: Fiscal et social
    structures: [agri]
    title: Résultat fiscal
    text: Du résultat comptable au bénéfice agricole, avec l'écart de valeur des stocks, la CSG non déductible, puis la répartition par associé.
    capture: agri-resultat-fiscal.png
    since: 2026.11.6
  - id: dep-ja
    domain: agri
    group: Fiscal et social
    structures: [agri]
    title: DEP et abattement jeune agriculteur
    text: Plafond de la DEP calculé, registre des déductions et de leurs utilisations ; abattement JA pendant les 60 mois suivant l'installation aidée.
    since: 2026.11.6
  - id: plus-values
    domain: agri
    group: Fiscal et social
    structures: [agri]
    title: Plus-values et crédits d'impôt
    text: Plus-values à court et long terme, exonération de l'article 151 septies simulée, crédits d'impôt bio, HVE et remplacement.
    since: 2026.11.6
  - id: liasse-ba
    domain: agri
    group: Fiscal et social
    structures: [agri]
    title: Aide à la liasse
    text: Cases de la 2139 ou de la 2143 calculées depuis la comptabilité, avec contrôles d'équilibre ; exports tableur et PDF.
    since: 2026.11.6
  - id: msa
    domain: agri
    group: Fiscal et social
    structures: [agri]
    title: Cotisations MSA
    text: Assiette sociale par exploitant, historique, comparaison entre moyenne triennale et assiette annuelle.
    capture: agri-msa.png
    since: 2026.11.6
  - id: aides
    domain: agri
    group: Aides et subventions
    structures: [agri]
    title: Dossiers d'aide
    text: PAC, ICHN, MAEC, DJA et aides régionales par campagne, avec les montants demandés, notifiés et versés ; la campagne PAC se crée en une fois.
    capture: agri-aides.png
    since: 2026.11.6
  - id: aides-banque
    domain: agri
    group: Aides et subventions
    structures: [agri]
    title: Virements et clôture
    text: Virements de l'ASP, de FranceAgriMer ou de la Région rattachés aux dossiers ; aides à recevoir ou reçues d'avance proposées à la clôture.
    since: 2026.11.6
  - id: subventions-investissement
    domain: agri
    group: Aides et subventions
    structures: [agri]
    title: Subventions d'investissement
    text: Reprise calculée à la clôture au rythme de l'amortissement des biens financés ; montants publiés par l'ASP comparés aux versements.
    since: 2026.11.6
  - id: activites
    domain: agri
    group: Activités et outils
    structures: [agri]
    title: Activités et marges
    capture: agri-marges.png
    text: Ateliers et productions par campagne, surfaces et effectifs, charges et produits ventilés, marges brutes ; lecture des activités d'Ekylibre.
    since: 2026.11.6
  - id: calculettes
    domain: agri
    group: Activités et outils
    structures: [agri]
    title: Calculettes
    text: Micro-BA ou réel, plafond DEP, fermages, MSA, coût du matériel, acomptes de TVA et les outils de terrain, préremplis depuis le dossier.
    since: 2026.11.6
  - id: facture-electronique-agricole
    domain: agri
    group: Activités et outils
    structures: [agri]
    title: Facture électronique agricole
    text: Autofactures reçues acceptées ou contestées, décomptes de coopérative en une écriture, e-reporting des ventes directes.
    since: 2026.11.6
  # --- TVA et fiscalité
  - id: tva-ca3
    domain: fiscal
    structures: [societe]
    title: Déclarations de TVA
    text: CA3 mensuelles calculées depuis les écritures, codes de TVA, autoliquidation, PDF et tableur pour la télédéclaration.
    since: 2026.11.1
  - id: tva-agricole
    domain: fiscal
    structures: [agri]
    title: TVA agricole
    text: CA12A préparée dans l'ordre du formulaire, acomptes trimestriels, CA3 trimestrielle sur option, remboursement de crédit, remboursement forfaitaire, livres des ventes et des achats.
    since: 2026.11.6
  - id: echeancier
    domain: fiscal
    title: Échéancier
    text: Déclarations, paiements et démarches en liste ou en calendrier, listes de contrôle cochées d'après le dossier, prélèvements reconnus sur les relevés, résumé du lundi, agenda iCal.
    capture: agri-echeancier.png
  - id: fiscalite
    domain: fiscal
    title: Profil fiscal
    text: Forme juridique, régimes datés et options fiscales avec leur date limite de renonciation.
  # --- Pilotage et clôture
  - id: tableau-de-bord
    domain: pilotage
    title: Tableau de bord
    text: Résultat, facturé, encours, carte « À traiter » ; budget prévu / réalisé, comptabilité par projet, rapport d'activité.
  - id: cloture
    domain: pilotage
    title: Clôture guidée
    text: Assistant en étapes, clôture provisoire puis définitive, affectation du résultat, FEC et archive pour l'expert-comptable.
  - id: reprise
    domain: pilotage
    title: Reprise d'historique
    text: FEC, tableur, export Ekylibre, restauration d'une sauvegarde Ekylibre.
  # --- Agents et API
  - id: cles-api
    domain: api
    title: Clés d'API
    text: Par structure et par utilisateur, domaines en lecture ou en écriture, expiration, révocation, journal des appels.
  - id: mcp
    domain: api
    title: Serveur MCP
    text: Un agent pose ses questions sur le dossier et saisit achats et dépenses en brouillon, jamais comptabilisés sans vérification.
  - id: assistant
    domain: api
    title: Assistant
    text: Questions sur le dossier depuis l'en-tête (intégration à activer), réponses tirées de la comptabilité et de l'échéancier.

integrations:
  - name: Qonto
    usage: Comptes, transactions, relevés, factures d'achat, ventes
    structures: toutes
  - name: HelloAsso
    usage: Adhésions et formulaires
    structures: associations
  - name: Brevo
    usage: Liste de contacts des adhérents
    structures: associations
  - name: Stancer
    usage: Versements et paiements par carte
    structures: toutes
  - name: Odoo
    usage: Caisse, factures clients
    structures: toutes
  - name: SMTP
    usage: Relances, reçus, factures par e-mail
    structures: toutes
  - name: Documenso
    usage: Signature électronique des baux
    structures: toutes
  - name: SUPER PDP
