features:
  # --- Comptabilité
  - id: plans-comptables
    domain: compta
    title: Plans comptables
    text: Plan associatif (ANC 2018-06), SCI, agricole (Recueil PCG 2026) ou général 2026, choisi à la création de la structure.
  - id: partie-double
    domain: compta
    title: Partie double au clavier
    text: Journaux, grand livre, balance, bilan et compte de résultat N / N-1.
  - id: compta-simplifiee
    domain: compta
    title: Comptabilité simplifiée
    text: Recettes et dépenses par catégorie, passage en partie double sans ressaisie.
  - id: validation
    domain: compta
    title: Écritures intangibles
    text: Validation par lots, écritures corrigées par extourne, historique, verrouillage de période.
  - id: lettrage-immos
    domain: compta
    title: Lettrage et immobilisations
    text: Lettrage automatique ou au clavier, à-nouveaux détaillés, immobilisations et amortissements, charges et produits constatés d'avance, contributions volontaires en nature.
  # --- Banque
  - id: import-bancaire
    domain: banque
    title: Relevés importés
    text: Import OFX et synchronisation Qonto, dédoublonnés, opérations annulées gérées, relevés de compte conservés.
  - id: rapprochement
    domain: banque
    title: Rapprochement au clavier
    text: Suggestions classées, rapprochement en masse et annulable, règles de catégorisation proposées depuis un mois.
    capture: rapprochement.png
  - id: reglements-multiples
    domain: banque
    title: Factures réglées en plusieurs fois
    text: Acomptes, échéanciers et virements échelonnés rattachés à une facture d'achat ou de vente.
    since: 2026.11.2
  - id: caisse-tresorerie
    domain: banque
    title: Caisse et trésorerie
    text: Caisse en espèces et dépôts en banque, solde bancaire face au solde comptable, prévisionnel de trésorerie sur 12 mois.
  # --- Achats
  - id: factures-achat
    domain: achats
    title: Factures fournisseurs lues
    text: Qonto ou dépôt d'un fichier, lecture Factur-X, PDF ou photo (OCR), pièce conservée.
  - id: catalogue
    domain: achats
    title: Catalogue et engagements
    text: Catalogue de produits, compte proposé par fournisseur, règlements rapprochés.
  - id: abonnements
    domain: achats
    title: Abonnements
    text: Coût mensuel, échéances manquantes et préavis de résiliation suivis échéance par échéance.
    capture: abonnements.png
  # --- Ventes
  - id: factures-vente
    domain: ventes
    title: Devis, factures et avoirs
    text: Numérotés, PDF Factur-X, journal des ventes, envoi par e-mail, relances et factures récurrentes.
    capture: ventes.png
  - id: encaissements
    domain: ventes
    title: Encaissements rapprochés
    text: Facture encaissée depuis le relevé, TVA à l'encaissement ou sur les débits.
    capture: facture.png
  - id: facture-electronique
    domain: ventes
    title: Facturation électronique
    text: Envoi et réception par une plateforme agréée (SUPER PDP), e-reporting, autofactures et décomptes de coopérative.
  # --- Baux
  - id: baux
    domain: baux
    structures: [sci]
    title: Baux
    text: Assistant, modèles relus, carte IGN, avis d'échéance, dépôt de garantie, quittances en un clic.
    capture: bail.png
  - id: signature
    domain: baux
    structures: [sci]
    title: Signature et révision
    text: Signature électronique Documenso, révision des loyers (ILC, ILAT, IRL, fermages) sur les indices INSEE.
  - id: associes
    domain: baux
    structures: [sci]
    title: Associés
    text: Registre des parts (usufruit, nue-propriété), comptes courants d'associés et intérêts.
  # --- Tiers
  - id: sirene
    domain: tiers
    title: Tiers et Sirene
    text: Structure et tiers pré-remplis et mis à jour depuis l'API Sirene de l'INSEE (SIREN, adresse, NAF, TVA).
    capture: sirene.png
  - id: adhesions
    domain: tiers
    structures: [asso]
    title: Adhésions
    text: Adhésions HelloAsso et caisse, échéances, relances, bénévolat, liste synchronisée vers Brevo.
    capture: adherents.png
  - id: recus-fiscaux
    domain: tiers
    structures: [asso]
    title: Reçus fiscaux
    text: Particuliers (Cerfa 11580) et entreprises (16216), dons en nature, état annuel.
  # --- Agricole
  - id: plan-agricole
    domain: agri
    structures: [agri]
    title: Plan « Exploitation agricole »
    text: EI, EARL, GAEC, SCEA, micro-BA ou réel, bilan et compte de résultat agricoles, soldes intermédiaires de gestion.
  - id: inventaire
    domain: agri
    structures: [agri]
    title: Inventaire de clôture
    text: Stocks ligne par ligne, avances aux cultures, lots d'animaux, valeur fiscale des stocks, écriture de stock.
  - id: biens-vivants
    domain: agri
    structures: [agri]
    title: Biens vivants
    text: Reproducteurs et plantations immobilisés, en-cours, entrées en production, morts, sinistres et abattage sanitaire.
  - id: resultat-fiscal
    domain: agri
    structures: [agri]
    title: Résultat fiscal et liasse
    text: Résultat fiscal des bénéfices agricoles, abattement jeune agriculteur, DEP, plus-values, aide à la liasse 2139 ou 2143.
    capture: agri-resultat-fiscal.png
  - id: msa
    domain: agri
    structures: [agri]
    title: Cotisations MSA
    text: Assiette sociale par exploitant, historique et comparaison entre moyenne triennale et annuelle.
  - id: aides
    domain: agri
    structures: [agri]
    title: Aides et subventions
    text: Registre des dossiers PAC, ICHN, MAEC, DJA, virements rapprochés, aides à recevoir à la clôture.
  - id: activites
    domain: agri
    structures: [agri]
    title: Activités et marges
    text: Ateliers et productions par campagne, ventilation des charges et produits, marges brutes.
  - id: calculettes
    domain: agri
    structures: [agri]
    title: Calculettes
    text: Micro-BA ou réel, plafond DEP, fermages, MSA, coût du matériel, acomptes de TVA, préremplies depuis le dossier.
  # --- TVA et fiscalité
  - id: tva-ca3
    domain: fiscal
    structures: [societe]
    title: Déclarations de TVA
    text: CA3 mensuelles calculées depuis les écritures, codes de TVA, autoliquidation, PDF et tableur pour la télédéclaration.
    since: 2026.11.1
  - id: tva-agricole
    domain: fiscal
    structures: [agri]
    title: TVA agricole
    text: CA12A, acomptes trimestriels, remboursement forfaitaire, livres des ventes et des achats.
  - id: echeancier
    domain: fiscal
    title: Échéancier
    text: Déclarations, paiements et démarches en liste ou en calendrier, listes de contrôle, résumé du lundi, agenda iCal.
    capture: agri-echeancier.png
  - id: fiscalite
    domain: fiscal
    title: Profil fiscal
    text: Forme juridique, régimes datés et options fiscales avec leur date limite de renonciation.
  # --- Pilotage et clôture
  - id: tableau-de-bord
    domain: pilotage
    title: Tableau de bord
    text: Résultat, facturé, encours, carte « À traiter » ; budget prévu / réalisé, comptabilité par projet, rapport d'activité.
  - id: cloture
    domain: pilotage
    title: Clôture guidée
    text: Assistant en étapes, clôture provisoire puis définitive, affectation du résultat, FEC et archive pour l'expert-comptable.
  - id: reprise
    domain: pilotage
    title: Reprise d'historique
    text: FEC, tableur, export Ekylibre, restauration d'une sauvegarde Ekylibre.
  # --- Agents et API
  - id: cles-api
    domain: api
    title: Clés d'API
    text: Par structure et par utilisateur, domaines en lecture ou en écriture, expiration, révocation, journal des appels.
  - id: mcp
    domain: api
    title: Serveur MCP
    text: Un agent pose ses questions sur le dossier et saisit achats et dépenses en brouillon, jamais comptabilisés sans vérification.
  - id: assistant
    domain: api
    title: Assistant
    text: Questions sur le dossier depuis l'en-tête (intégration à activer), réponses tirées de la comptabilité et de l'échéancier.

