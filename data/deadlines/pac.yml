- id: PAC-03
  title: Paiements PAC (avance et solde)
  domain: pac
  organism: ASP
  summary: Avance à partir du 16 octobre (75 % du 1er pilier, 85 % de l'ICHN) ; solde à partir de début décembre ; MAEC et bio souvent au printemps suivant.
  applies: {flags: [pac]}
  events:
    - label: Avance des aides PAC
      rule: {type: annual_param, key: agenda.pac.advance_payment, fallback: {type: fixed, days: ["10-16"], shift: none}}
      quiet: true
      action: {label: Rattacher les virements, route: /aids/}
    - label: Solde des aides PAC
      rule: {type: fixed, days: ["12-01"], shift: none}
      quiet: true
      action: {label: Rattacher les virements, route: /aids/}
  lyvre_data: Produits à recevoir des aides PAC (441, 745) ; virements de l'ASP rapprochés des relevés.
  links:
    - https://www.terre-net.fr/aides-pac/article/904926/les-premiers-versements-de-la-pac-2026-arrivent-sur-les-comptes-des-agriculteurs
  reliability: A

