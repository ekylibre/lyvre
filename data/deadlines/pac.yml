# PAC et aides (audit_calendrier.md § 2.4) : rappels seulement (AGD9), sauf le rattachement comptable des aides (AG3).
- id: PAC-01
  title: Demande d'aides PAC (telepac)
  domain: pac
  organism: DDT(M), ASP
  reminder_only: true
  summary: Ouverture le 1er avril ; date limite sans pénalité vers le 15 mai (publiée chaque année) ; dépôt tardif avec 1 % de pénalité par jour ouvré ; corrections jusqu'au 20 septembre.
  applies: {flags: [pac]}
  events:
    - label: Date limite de la demande PAC
      rule: {type: annual_param, key: agenda.pac.deadline, fallback: {type: fixed, days: ["05-15"]}}
      reminders: [45, 15, 5]
      action: {label: Ouvrir telepac, url: "https://www.telepac.agriculture.gouv.fr"}
    - label: Fin du dépôt tardif
      rule: {type: annual_param, key: agenda.pac.late_deadline, fallback: {type: fixed, days: ["06-09"]}}
      quiet: true
    - label: Fin des corrections et retraits
      rule: {type: fixed, days: ["09-20"], shift: none}
      quiet: true
  prepare:
    - Parcelles et assolement, écorégime, BCAE, engagements MAEC et bio, ICHN, case de l'aide à l'assurance récolte
  links:
    - https://www.telepac.agriculture.gouv.fr
    - https://agriculture.gouv.fr/telepac-2026
  reliability: A

