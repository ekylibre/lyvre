  title: Remboursement de crédit de TVA (3519)
  domain: tva
  organism: SIE
  summary: Sur la CA12A si le crédit atteint 150 € ; en CA3, demande à partir de 760 € en cours d'année. Seuil infra-annuel en RSA à confirmer.
