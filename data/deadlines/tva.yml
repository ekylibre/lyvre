# TVA (audit_calendrier.md § 2.1). Les déclarations préparées par Lyvre (CA3, CA12A, acomptes, 3520) prennent
# leurs dates, montants et statuts dans le moteur de TVA (règle `lyvre`).
- id: TVA-01
  title: Déclaration annuelle de TVA (CA12A, 3517-AGR-SD)
  domain: tva
  organism: SIE
  summary: Déclaration annuelle du régime simplifié agricole ; régularise les acomptes versés.
  applies: {vat_regime: [rsa_installments]}
  events:
    - label: CA12A
      rule: {type: lyvre, source: vat_returns, form: CA12A}
      payment: true
      reminders: [30, 7]
      action: {label: Ouvrir la CA12A, route: /vat-returns/}
  prepare:
    - Chiffre d'affaires HT par taux (5,5 %, 10 %, 20 %)
    - TVA sur immobilisations et sur autres biens et services, régularisations
    - Acomptes versés, crédit antérieur, référence des acomptes suivants
  lyvre_data: Soldes 4457 (collectée), 44562 et 44566 (déductible), 44581 (acomptes), 44567 (crédit) ; ventes 70 par taux.
  penalties: Intérêt de retard de 0,20 % par mois (CGI art. 1727) ; majoration de 10 % (art. 1731) ; de 10 % à 40 % après mise en demeure (art. 1728).
  links:
    - https://www.impots.gouv.fr/formulaire/3517-agr-sd/tva-regime-simplifie-de-lagriculture
  reliability: R

- id: TVA-02
  title: Acomptes trimestriels de TVA (3525 bis)
  domain: tva
  organism: SIE
  summary: Au moins 1/5 de la TVA due l'année précédente, sauf dispense sous 1 000 € ; modulation possible.
  applies: {vat_regime: [rsa_installments]}
  events:
    - label: Acompte de TVA
      rule: {type: lyvre, source: vat_installments}
      payment: true
      reminders: [15, 5]
      action: {label: Préparer le 3525 bis, route: /vat-returns/}
  prepare:
    - TVA due de la dernière CA12A (ligne 23)
    - Estimation de la TVA de l'année en cours (modulation)
  lyvre_data: TVA nette de la dernière CA12A, acomptes déjà versés (44581).
  penalties: Si la TVA réelle dépasse de plus de 30 % les acomptes réduits, intérêt de retard et majoration de 10 %.
  links:
    - https://bofip.impots.gouv.fr/node/10637
  reliability: R

