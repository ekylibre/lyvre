{% extends "base.html" %}
{% block title %}{{ 'Modifier' if user else 'Nouvel' }} utilisateur — Compta Asso{% endblock %}
{% block content %}
<h2 class="mb-3">{{ 'Modifier' if user else 'Nouvel' }} utilisateur</h2>

<div class="card">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-control" required
               value="{{ form.email if form.email else (user.email if user else '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Nom complet</label>
        <input type="text" name="full_name" class="form-control"
               value="{{ form.full_name if form.full_name else (user.full_name if user else '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label">
          Mot de passe {% if user %}<small class="text-muted">(laisser vide pour ne pas changer)</small>{% else %}*{% endif %}
        </label>
        <input type="password" name="password" class="form-control"
               {% if not user %}required{% endif %}>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin"
               {% if (form.is_admin if form else None) or (user and user.is_admin) %}checked{% endif %}>
        <label class="form-check-label" for="is_admin">Administrateur</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
               {% if (form.is_active if form else None) or (not user) or (user and user.is_active) %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Compte actif</label>
      </div>

      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{{ url_for('users.index') }}" class="btn btn-link">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
