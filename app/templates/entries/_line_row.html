<tr>
  <td>
    <input type="text" id="account-search-{{ index }}" class="form-control form-control-sm"
           placeholder="Code ou libellé…"
           value="{{ line.account.code if line else '' }}"
           hx-get="{{ url_for('accounts.search') }}"
           hx-trigger="keyup changed delay:200ms"
           hx-target="#account-select-{{ index }}"
           hx-swap="innerHTML"
           hx-vals='js:{q: document.getElementById("account-search-{{ index }}").value}'>
    <select name="account_id[]" id="account-select-{{ index }}" class="form-select form-select-sm mt-1" required>
      {% if line %}
        <option value="{{ line.account.id }}" selected>{{ line.account.code }} — {{ line.account.label }}</option>
      {% else %}
        <option value="">Sélectionner un compte…</option>
      {% endif %}
    </select>
  </td>
  <td>
    <input type="text" name="line_label[]" class="form-control form-control-sm" placeholder="Libellé ligne"
           value="{{ line.label if line and line.label else '' }}">
  </td>
  <td>
    <input type="number" name="debit[]" step="0.01" min="0" class="form-control form-control-sm text-end"
           placeholder="0,00"
           value="{{ '%.2f'|format(line.debit_cents / 100) if line and line.debit_cents else '' }}">
  </td>
  <td>
    <input type="number" name="credit[]" step="0.01" min="0" class="form-control form-control-sm text-end"
           placeholder="0,00"
           value="{{ '%.2f'|format(line.credit_cents / 100) if line and line.credit_cents else '' }}">
  </td>
  <td>
    <button type="button" class="btn btn-outline-danger btn-sm"
            onclick="this.closest('tr').remove()">✕</button>
  </td>
</tr>
