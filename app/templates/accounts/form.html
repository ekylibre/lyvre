{% extends "base.html" %}
{% block title %}{{ 'Modifier' if account else 'Nouveau' }} compte{% endblock %}
{% block content %}
<h2>{{ 'Modifier' if account else 'Nouveau' }} compte</h2>
<form method="post" class="col-md-6 mt-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Code</label>
    <input type="text" name="code" value="{{ account.code if account else '' }}"
           class="form-control font-monospace" {% if account %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Libellé</label>
    <input type="text" name="label" value="{{ account.label if account else '' }}"
           class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Type</label>
    <select name="account_type" class="form-select">
      {% for value, label in account_types %}
        <option value="{{ value }}" {{ 'selected' if account and account.account_type == value }}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  {% if not account %}
  <div class="mb-3">
    <label class="form-label">Compte parent (code, optionnel)</label>
    <input type="text" name="parent_code" class="form-control font-monospace">
  </div>
  {% endif %}
  <button type="submit" class="btn btn-primary">Enregistrer</button>
  <a href="{{ url_for('accounts.index') }}" class="btn btn-outline-secondary ms-2">Annuler</a>
</form>
{% endblock %}
