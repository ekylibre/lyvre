{% extends "base.html" %}
{% block title %}Nouveau journal{% endblock %}
{% block content %}
<h2>Nouveau journal</h2>
<form method="post" class="col-md-5 mt-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Code (ex: BQ, VT, AC, OD)</label>
    <input type="text" name="code" class="form-control font-monospace text-uppercase"
           maxlength="10" required placeholder="BQ">
  </div>
  <div class="mb-3">
    <label class="form-label">Libellé</label>
    <input type="text" name="label" class="form-control" required placeholder="Banque">
  </div>
  <button type="submit" class="btn btn-primary">Créer</button>
  <a href="{{ url_for('journals.index') }}" class="btn btn-outline-secondary ms-2">Annuler</a>
</form>
{% endblock %}
