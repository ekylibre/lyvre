{% extends "base.html" %}
{% block title %}Journaux{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Journaux comptables</h2>
  <a href="{{ url_for('journals.new') }}" class="btn btn-primary btn-sm">+ Nouveau journal</a>
</div>
<table class="table table-sm table-hover">
  <thead class="table-light">
    <tr><th>Code</th><th>Libellé</th></tr>
  </thead>
  <tbody>
    {% for j in journals %}
    <tr>
      <td class="font-monospace fw-bold">{{ j.code }}</td>
      <td>{{ j.label }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="text-muted text-center">Aucun journal.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
